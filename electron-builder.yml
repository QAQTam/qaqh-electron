appId: com.qaqh.desktop
productName: QAQ-Harness
copyright: Copyright © 2026 QAQ-Harness Authors
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - renderer/**/*
  - build/icons/**/*
  - native/**/*
  - package.json
  - "!dist/**/*.map"

asar: true
# Node-API 协议客户端必须在 asar 之外（主进程运行时经 app.asar.unpacked 加载）。
asarUnpack:
  - "**/*.node"
afterPack: scripts/verify-package.cjs

extraResources:
  - from: resources/bin/
    to: bin/
    filter:
      - "qaqh-daemon"
      - "qaqh-daemon.exe"

linux:
  icon: build/icons
  syncDesktopName: true
  executableArgs:
    - "--enable-features=UseOzonePlatform"
    - "--ozone-platform-hint=auto"
    - "--renderer-process-limit=1"
    - "--js-flags=--max-old-space-size=256 --optimize-for-size"
    - "--disable-3d-apis"
    - "--disable-webgl"
    - "--disable-speech-api"
    - "--disk-cache-size=16777216"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  category: Development
  synopsis: QAQ-Harness AI Coding Agent Desktop Client
  description: Next-generation multi-agent coding harness with native Linux support via Electron

deb:
  depends:
    - libnotify4
    - libxtst6
    - libnss3
    - libasound2
  # dpkg 管理所有程序文件;安装钩子只设置 Chromium sandbox 权限。
  afterInstall: scripts/maint/postinst.sh

appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

win:
  icon: build/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
