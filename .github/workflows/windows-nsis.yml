name: Windows NSIS release (temporary)

on:
  push:
    branches: [main]
    paths:
      - .gitattributes
      - justfile
      - electron-builder.yml
      - scripts/build-all.mjs
      - scripts/packaging.cjs
      - scripts/verify-package.cjs
      - scripts/packaging.test.mjs
      - .github/workflows/windows-nsis.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-nsis:
    runs-on: windows-latest
    steps:
      - name: Checkout Electron app
        uses: actions/checkout@v4
        with:
          path: qaqh-electron

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: qaqtam/qaqh-backend
          ref: main
          path: qaqh-backend

      - name: Checkout backend AI SDK
        uses: actions/checkout@v4
        with:
          repository: qaqtam/mutil-ai
          ref: main
          path: mutil-ai

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Read release version
        id: meta
        working-directory: qaqh-electron
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows NSIS installer
        working-directory: qaqh-electron
        run: just nsis

      - name: Upload installer to GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: QAQ-Harness ${{ steps.meta.outputs.version }} (Windows NSIS)
          prerelease: true
          generate_release_notes: true
          files: qaqh-electron/release/*.exe
          fail_on_unmatched_files: true
