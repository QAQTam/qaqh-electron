# shell 包口径(定稿架构):系统包只装 Electron 运行时 + baseline(plain dir)
# + 双 CLI(qaqh-maint / qaqh-update)+ daemon 兜底。用户域 overlay 由 updater 管理。
# 与 electron-builder.yml(全量便携口径,asar:true)并存;build-all.mjs --shell 选用本文件。
appId: com.qaqh.desktop
productName: QAQ-Harness
copyright: Copyright © 2026 QAQ-Harness Authors
directories:
  output: release-shell
  buildResources: build

files:
  - dist/**/*
  - renderer/**/*
  - package.json
  - "!dist/**/*.map"

# 定稿架构:baseline 用 plain dir(bootstrap require 直读),不走 asar。
asar: false
afterPack: scripts/verify-package.cjs

extraResources:
  - from: resources/bin/
    to: bin/
    filter:
      - "**/*"
  - from: resources/baseline/
    to: baseline/
    filter:
      - "**/*"

linux:
  icon: build/icons
  syncDesktopName: true
  executableArgs:
    - "--enable-features=UseOzonePlatform"
    - "--ozone-platform-hint=auto"
    - "--renderer-process-limit=1"
    - "--js-flags=--max-old-space-size=256 --optimize-for-size"
    - "--disable-3d-apis"
    - "--disable-webgl"
    - "--disable-speech-api"
    - "--disk-cache-size=16777216"
  category: Development
  synopsis: QAQ-Harness AI Coding Agent Desktop Client
  description: Next-generation multi-agent coding harness with native Linux support via Electron
  target:
    - target: deb
      arch:
        - x64

deb:
  depends:
    - libnotify4
    - libxtst6
    - libnss3
    - libasound2
  # 路径按 projectDir 解析(app-builder-lib FpmTarget::getResource)。
  # fpm 只暴露 afterInstall/afterRemove;停 daemon 折进 postrm(见该脚本头注释)。
  afterInstall: scripts/maint/postinst.sh
  afterRemove: scripts/maint/postrm.sh
  # deb 许可证元数据:软件中心/安装器(如 gnome-software 装本地 deb)读的是包内
  # /usr/share/doc/qaqh-electron/copyright(DEP-5),不是 control 的 License 字段;
  # electron-builder 的 deb 目标不像 flatpak 那样自动带 copyright(FpmTarget 无
  # copyLicenseFile),通过 fpm 原生参数透传补上。文本源:webui/LICENSE-*。
  fpm:
    - "build/deb/copyright=/usr/share/doc/qaqh-electron/copyright"
    - "build/deb/com.qaqh.desktop.metainfo.xml=/usr/share/metainfo/com.qaqh.desktop.metainfo.xml"
