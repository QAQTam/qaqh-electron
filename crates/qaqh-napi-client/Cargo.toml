[package]
name = "qaqh-napi-client"
version = "4.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Node-API (Electron main) bindings over qaqh-client for the QAQ-Harness desktop shell"
publish = false

[lib]
name = "qaqh_napi_client"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
napi = { version = "3.16", features = ["async", "serde-json"] }
napi-derive = "3.7"
# `shell-stream`：用户 shell 的 ws 数据面客户端（ADR-0028 切片 5 · 方案 A）。
# 帧编解码与重连语义留在 Rust `qaqh-client`，本层只做搬运——协议运行时只有一份。
qaqh-client = { path = "../../../qaqh-backend/crates/qaqh-client", features = ["shell-stream"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
napi-build = "2"

# 保持默认 unwind 的 panic 策略：napi 层把未捕获 panic 转成 Promise reject，
# 绝不能在主进程里 abort 掉整个 Electron。
[profile.release]
panic = "unwind"
