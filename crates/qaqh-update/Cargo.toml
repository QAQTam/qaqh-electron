[package]
name = "qaqh-update"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared QAQ-Harness update catalog, planning, state, and source engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
zip = "8.6"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[[bin]]
name = "qaqh-pack"
path = "src/bin/pack.rs"

[[bin]]
name = "qaqh-maint"
path = "src/bin/maint.rs"

[[bin]]
name = "qaqh-update"
path = "src/bin/update.rs"

[lints.clippy]
unwrap_used = "deny"
string_slice = "deny"
