appId: com.qaqh.desktop
productName: QAQ-Harness
copyright: Copyright © 2026 QAQ-Harness Authors
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - renderer/**/*
  - build/icons/**/*
  - native/**/*
  - package.json
  - "!dist/**/*.map"

asar: true
# Node-API 协议客户端必须在 asar 之外（主进程运行时经 app.asar.unpacked 加载）。
asarUnpack:
  - "**/*.node"
afterPack: scripts/verify-package.cjs

extraResources:
  - from: resources/bin/
    to: bin/
    filter:
      - "qaqh-daemon"
      - "qaqh-daemon.exe"
      # 热更新 handoff 工作器(仅 Windows 分发;Linux 走 dpkg,verify-package 会
      # 拒绝 linux 包里出现 updater CLI)。
      - "qaqh-update"
      - "qaqh-update.exe"
  # 插件(只带 manifest + 构建产物,源码不进包)。
  - from: plugins/
    to: plugins/
    filter:
      - "**/plugin.json"
      - "**/dist/**"
      - "**/theme.css"
  # 桌面通知静态素材(toastXml <image> 由系统进程直读路径,必须在 asar 外)。
  - from: resources/notify/
    to: notify/

linux:
  icon: build/icons
  # 语音运行时(见 win 段注释):worker 与 sherpa 原生包放 asar 外的 voice-runtime。
  extraResources:
    - from: dist/main/voice-worker.cjs
      to: voice-runtime/voice-worker.cjs
    - from: dist/main/voice-worker.cjs.map
      to: voice-runtime/voice-worker.cjs.map
    - from: node_modules/sherpa-onnx-node
      to: voice-runtime/node_modules/sherpa-onnx-node
    - from: node_modules/sherpa-onnx-linux-x64
      to: voice-runtime/node_modules/sherpa-onnx-linux-x64
  syncDesktopName: true
  executableArgs:
    - "--enable-features=UseOzonePlatform"
    - "--ozone-platform-hint=auto"
    - "--renderer-process-limit=1"
    - "--js-flags=--max-old-space-size=256 --optimize-for-size"
    - "--disable-3d-apis"
    - "--disable-webgl"
    - "--disable-speech-api"
    - "--disk-cache-size=16777216"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  category: Development
  synopsis: QAQ-Harness AI Coding Agent Desktop Client
  description: Next-generation multi-agent coding harness with native Linux support via Electron

deb:
  depends:
    - libnotify4
    - libxtst6
    - libnss3
    - libasound2
  # dpkg 管理所有程序文件;安装钩子只设置 Chromium sandbox 权限。
  afterInstall: scripts/maint/postinst.sh

appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

win:
  icon: build/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # 语音运行时:worker 与 sherpa 原生包必须在 asar 外——ELECTRON_RUN_AS_NODE 子进程
  # 没有 asar 补丁，且 process.dlopen 无法加载 asar 内的 .node。布局即 node 解析链:
  # voice-runtime/node_modules/sherpa-onnx-node 内部 require('sherpa-onnx-win-x64')
  # 沿 voice-runtime/node_modules 命中同级包。
  extraResources:
    - from: dist/main/voice-worker.cjs
      to: voice-runtime/voice-worker.cjs
    - from: dist/main/voice-worker.cjs.map
      to: voice-runtime/voice-worker.cjs.map
    - from: node_modules/sherpa-onnx-node
      to: voice-runtime/node_modules/sherpa-onnx-node
    - from: node_modules/sherpa-onnx-win-x64
      to: voice-runtime/node_modules/sherpa-onnx-win-x64

nsis:
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
