appId: com.qaqh.desktop
productName: QAQ-Harness
copyright: Copyright © 2026 QAQ-Harness Authors
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - renderer/**/*
  - build/icons/**/*
  - package.json
  - "!dist/**/*.map"

asar: true
afterPack: scripts/verify-package.cjs

extraResources:
  - from: resources/bin/
    to: bin/
    filter:
      - "**/*"

linux:
  icon: build/icons
  syncDesktopName: true
  executableArgs:
    - "--enable-features=UseOzonePlatform"
    - "--ozone-platform-hint=auto"
    - "--renderer-process-limit=1"
    - "--js-flags=--max-old-space-size=256 --optimize-for-size"
    - "--disable-3d-apis"
    - "--disable-webgl"
    - "--disable-speech-api"
    - "--disk-cache-size=16777216"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  category: Development
  synopsis: QAQ-Harness AI Coding Agent Desktop Client
  description: Next-generation multi-agent coding harness with native Linux support via Electron

deb:
  depends:
    - libnotify4
    - libxtst6
    - libnss3
    - libasound2
  # 全量口径同样需要 postinst:baseline seeding 部分在缺 baseline 目录时自动跳过,
  # chrome-sandbox 4755 兜底则两种口径都需要(见 scripts/maint/postinst.sh)。
  afterInstall: scripts/maint/postinst.sh
  # deb 许可证元数据(DEP-5 copyright + AppStream metainfo),同 shell 口径,
  # 见 electron-builder.shell.yml 的说明。
  fpm:
    - "build/deb/copyright=/usr/share/doc/qaqh-electron/copyright"
    - "build/deb/com.qaqh.desktop.metainfo.xml=/usr/share/metainfo/com.qaqh.desktop.metainfo.xml"

appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
